<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project Runner · 运行管理台</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="live-dot" aria-hidden="true"></span><div class="brand-text"><span class="kicker">Project Runner</span><strong>运行管理台</strong></div></div>
  <button id="docBtn" type="button" title="运行只读诊断（同 manager doctor）">诊断</button>
  <button id="themeBtn" type="button" title="切换深色/浅色主题" aria-label="切换主题">◐</button>
  <button id="filesBtn" type="button" disabled>文件</button>
  <span class="badge ro" id="verBadge">本地</span>
  <div class="home-path" id="homePath"></div>
  <span class="conn" id="connState">连接中…</span>
</header>
<div class="banner warn" id="roBanner">本机管理台（仅 127.0.0.1，无令牌）：启停/ack/移除与 manager CLI 同一实现（仅本 Skill 登记的受管应用）；stop 是有界强制终止，不杀进程树。</div>
<div class="banner" id="fatalBanner" hidden></div>
<div class="banner warn" id="exitBanner" hidden></div>
<main class="layout">
  <aside aria-label="应用列表">
    <div class="panel-title">
      <div class="panel-heading"><span class="panel-kicker">Applications</span><strong>应用</strong></div>
      <span class="badge" id="appCount">0</span>
      <button id="refreshBtn" class="icon-btn" type="button" title="刷新列表" aria-label="刷新列表"></button>
    </div>
    <div class="app-search"><input id="appSearch" type="search" placeholder="过滤应用（别名/端口/路径）…" spellcheck="false" aria-label="过滤应用"></div>
    <div id="appList" role="list"></div>
  </aside>
  <section class="detail-panel" aria-label="应用详情">
    <div class="detail-head">
    <button id="detailBar" class="detail-bar" type="button" hidden aria-expanded="false" title="展开/收起应用详情">
      <span class="db-toggle" aria-hidden="true">▸</span>
      <span id="detailSummary" class="db-summary"></span>
      <span class="db-hint">详情</span>
    </button>
    <span id="detailOps" class="op-group detail-ops" hidden></span>
    </div>
    <div id="detail"><div class="empty">正在加载注册表…<br>这里展示由本 Skill 启动并登记的应用；IDEA / 手工启动的进程不会出现。</div></div>
    <section class="log-panel" aria-label="运行日志">
      <div class="log-toolbar">
        <select id="runSel" aria-label="日志源" disabled></select>
        <input id="logFilter" type="search" placeholder="正则过滤…" spellcheck="false" aria-label="日志正则过滤" disabled>
        <button id="errorsBtn" type="button" aria-pressed="false" title="只看错误（内置错误规则：ERROR/Exception/Caused by 等）" disabled>只看错误</button>
        <button id="pauseBtn" type="button" aria-pressed="false">暂停</button>
        <button id="followBtn" type="button" aria-pressed="true" disabled>跟随中</button>
        <button id="clearBtn" type="button" disabled>清屏</button>
        <button id="dlBtn" type="button" disabled title="下载当前缓存的日志行">下载</button>
        <span id="logMeta"></span>
      </div>
      <div id="log" tabindex="0" aria-label="日志内容"><div class="empty">选择左侧应用后查看日志。</div></div>
    </section>
  </section>
</main>
<aside id="fileDrawer" class="file-drawer" hidden aria-label="项目文件">
  <div class="fd-head">
    <strong>项目文件</strong>
    <span class="badge" id="fdRoot"></span>
    <button id="fdRefresh" class="icon-btn" type="button" title="刷新文件树" aria-label="刷新文件树">↻</button>
    <button id="fdClose" class="icon-btn" type="button" title="关闭" aria-label="关闭文件面板">✕</button>
  </div>
  <div class="fd-body">
    <div class="fd-filter"><input id="fdFilter" type="search" placeholder="过滤当前层级…" aria-label="过滤当前层级"><button id="fdFilterClear" type="button" title="清空过滤">清空</button></div>
    <div id="fdTree" class="fd-tree"></div>
    <div class="fd-preview">
      <div id="fdPath" class="fd-path">选择文件查看内容（只读，UTF-8）</div>
      <div style="display:flex;gap:6px;padding:5px 10px"><button id="fdTail" type="button" disabled>尾部</button><button id="fdPrev" type="button" disabled>上一页</button><button id="fdNext" type="button" disabled>下一页</button></div>
      <div id="fdBody" class="fd-content"></div>
    </div>
  </div>
</aside>
<div id="docOverlay" class="doc-overlay" hidden>
  <div class="doc-card" role="dialog" aria-label="只读诊断">
    <div class="doc-head"><strong>只读诊断</strong><span class="dim">同 manager doctor：列出问题不自动修复</span><button id="docClose" class="icon-btn" type="button" title="关闭" aria-label="关闭诊断">✕</button></div>
    <pre id="docBody"></pre>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
