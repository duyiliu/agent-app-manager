name: Nightly

# 夜间压力测试：锁并发这类只在真竞争下暴露的问题放这里跑，
# 不放进 PR 门禁，避免偶发调度抖动把正常改动卡红。
on:
  schedule:
    - cron: '0 18 * * *' # UTC 18:00 = 北京时间次日 02:00
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locks-stress:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Locks concurrency stress
        run: node skills/project-runner/scripts/test/locks-stress.mjs
