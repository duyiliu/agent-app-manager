name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: 编译校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖（存在 lockfile 时）
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: 编译（语法校验）
        run: npm run build
