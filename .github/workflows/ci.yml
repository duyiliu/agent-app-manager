name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # 每周一 02:00（北京时间）巡检 Windows runner 镜像与环境漂移
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:

jobs:
  build:
    name: 编译校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖（存在 lockfile 时）
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: 编译（语法校验）
        run: npm run build

  test:
    name: 冒烟测试（Linux）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖（存在 lockfile 时）
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: 全量冒烟
        run: node scripts/test-all.mjs

  test-windows:
    name: 冒烟测试（Windows，按需）
    # Windows 全量约 12 分钟（探针每次起 pwsh 约 550ms）：日常 PR 不跑，只在
    # 打 tag 发版闸门、手动触发、每周巡检、或 PR 显式打 ci:windows 标签时执行。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      startsWith(github.ref, 'refs/tags/') ||
      contains(github.event.pull_request.labels.*.name, 'ci:windows')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖（存在 lockfile 时）
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: 编译（语法校验）
        run: npm run build

      - name: 全量冒烟
        run: node scripts/test-all.mjs
