name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # 每周一 02:00（北京时间）巡检 Windows runner 镜像与环境漂移
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:

# 同一分支（PR 按 head_ref）有新 run 时取消在跑的旧轮：
# 连续 push / 打标签重触 / 重复 dispatch 不再同时烧 runner。
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖（存在 lockfile 时）
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: 编译（语法校验）
        run: npm run build

  test:
    name: 冒烟测试（Linux）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖（存在 lockfile 时）
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: 全量冒烟
        run: node scripts/test-all.mjs

  test-windows-critical:
    name: 冒烟测试（Windows 关键集）
    # PR 阶段只守事故级不变量（密钥泄露、状态机错乱、并发写坏注册表、数据目录迁移、误删）：
    # manager / env / discovery-redaction / locks / home-migration / cli，约 4.5 分钟。
    # 最贵的 runtime-smoke（215s）不在这里，交给 push main 与发版 tag 的全量 job。
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖（存在 lockfile 时）
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: 关键集冒烟
        run: node scripts/test-all.mjs manager-smoke env-smoke discovery-redaction-smoke locks-smoke home-migration cli-smoke

  # 全量矩阵墙钟约 3-5 分钟（探针每次起 pwsh 约 550ms）：只在发版 tag、每周巡检、
  # 手动触发时执行；main push 与 PR 都不跑，Windows 回归由巡检/发版闸门兜底。
  test-windows-list:
    name: Windows 全量名单
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.list.outputs.tests }}
    steps:
      - uses: actions/checkout@v4

      - id: list
        run: echo "tests=$(node scripts/test-all.mjs --list-json)" >> "$GITHUB_OUTPUT"

  test-windows:
    name: 冒烟测试（Windows 全量 / ${{ matrix.test }}）
    needs: test-windows-list
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.test-windows-list.outputs.tests) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖（存在 lockfile 时）
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: 全量冒烟
        run: node scripts/test-all.mjs ${{ matrix.test }}
