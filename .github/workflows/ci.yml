name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: |
          node -e "const fs=require('fs'),p=require('path'),cp=require('child_process');const walk=d=>fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(p.join(d,e.name)):[p.join(d,e.name)]);for(const f of walk('skills/project-runner/scripts').filter(x=>x.endsWith('.mjs')))cp.execFileSync(process.execPath,['--check',f],{stdio:'inherit'});"
      - name: Log rotation test
        run: node skills/project-runner/scripts/test/log-rotation.mjs
      - name: UI smoke test
        run: node skills/project-runner/scripts/test/ui-smoke.mjs
      - name: UI source-follow test
        run: node skills/project-runner/scripts/test/ui-src-follow.mjs
      - name: Manager smoke test
        run: node skills/project-runner/scripts/test/manager-smoke.mjs
      - name: CLI smoke test
        run: node skills/project-runner/scripts/test/cli-smoke.mjs
      - name: Runtime smoke test
        run: node skills/project-runner/scripts/test/runtime-smoke.mjs
